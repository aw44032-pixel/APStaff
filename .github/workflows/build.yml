  name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o APStaffAttendance.zip
          shopt -s dotglob
          if [ -d "APStaffAttendance" ]; then
            cp -r APStaffAttendance/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Permissions and Make Executable
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            cd APStaffAttendance && ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Staff-Attendance-APK
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
